<!--
Source for the social/link-preview card (og:image + twitter:image in
index.html — currently og-share-v2.png). Not linked from any live page —
kept here purely so the image can be edited and re-rendered instead of
reverse-engineered from the PNG.

To regenerate after an edit:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
    --disable-gpu --no-sandbox --window-size=1200,630 \
    --screenshot="og-share-vN.png" --virtual-time-budget=3000 \
    "file://$(pwd)/og-share-source.html"
Then save the output under a NEW filename (increment the version suffix,
e.g. og-share-v3.png) and update the og:image/twitter:image URLs in
index.html to match — messaging apps cache link-preview images by URL,
so overwriting the same filename won't clear stale cached copies (see
commit 0fa53fc, the same fix applied to the email signature logo).
-->
<!doctype html>
<html lang="en">
<head>

</head>

        <line x1="120" y1="150" x2="120" y2="210" stroke-width="6" />

    </div>
  </div>
</body>
</html>
